name: Tests
on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - main

concurrency:
  group: ci-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Code fetch
        uses: actions/checkout@v7

      - name: Setup Node JS
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'yarn'

      - name: Yarn setup
        run: yarn install --frozen-lockfile

      - name: Run Vitest
        run: yarn test

  ruby-plus-system:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Code fetch
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Setup Node JS
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'yarn'

      - name: Yarn setup
        run: |
          yarn install --frozen-lockfile

      # apt's chromium on Ubuntu 24.04 is a snap shim; snapcraft.io often 408s in GHA.
      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Set BROWSER_PATH
        run: echo "BROWSER_PATH=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"

      - name: Run tests
        env:
          RAILS_ENV: test
          ADMIN_USERNAME: ADMIN
          ADMIN_PASSWORD: PASSWORD
          AWS_ACCESS_KEY_ID: STUB
          AWS_SECRET_ACCESS_KEY: STUB
        run: bundle exec rspec ./spec ./engines/admin/spec
