plugins:
  - rubocop-capybara
  - rubocop-factory_bot
  - rubocop-rails
  - rubocop-rspec
  - rubocop-rspec_rails

AllCops:
  NewCops: enable
  TargetRailsVersion: 6.1
  Exclude:
    - bin/bundle
    - db/queue_schema.rb
    - db/schema.rb
    - tmp/**/*
    - "**/**/*.gemspec"

Metrics/MethodLength:
  CountAsOne:
    - array
    - hash
    - heredoc
  Exclude:
    - "**/helpers/**/*"
    - "db/migrate/**/*"

Metrics/AbcSize:
  Exclude:
    - "**/helpers/**/*"
    - "db/migrate/**/*"

Metrics/BlockLength:
  Exclude:
    - "**/config/**/*"
    - "**/lib/tasks/**/*"
    - "**/spec/**/*"

Metrics/ClassLength:
  Exclude:
    - "db/migrate/**/*"

Metrics/CyclomaticComplexity:
  Exclude:
    - "db/migrate/**/*"

Metrics/PerceivedComplexity:
  Exclude:
    - "db/migrate/**/*"

Rails/SkipsModelValidations:
  Exclude:
    - "db/migrate/**/*"

Rails/ThreeStateBooleanColumn:
  Exclude:
    - "db/migrate/**/*"

Metrics/ModuleLength:
  Exclude:
    - "**/helpers/**/*"

Naming/PredicateMethod:
  Enabled: false

RSpec/ChangeByZero:
  NegatedMatcher: not_change

RSpec/ExampleLength:
  Max: 20
  Exclude:
    - "spec/requests/**/*"

RSpec/MultipleExpectations:
  Max: 4
  Exclude:
    - "spec/requests/**/*"

RSpec/MultipleMemoizedHelpers:
  Enabled: false

RSpec/NestedGroups:
  Max: 5

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false
